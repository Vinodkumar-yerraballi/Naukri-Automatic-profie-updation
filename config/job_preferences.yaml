job_search:

  roles:
    - Data Analyst
    - Data Scientist
    - Business Intelligence Analyst
    - BI Analyst
    - Reporting Analyst
    - Machine Learning Engineer
    - ML Engineer
    - AI Analyst

  locations:
    - Remote
    - Bangalore
    - Hyderabad
    - Chennai

  work_modes:
    - Remote
    - Hybrid

  experience:
    minimum: 0
    maximum: 2

  employment_type:
    - Full Time

  max_searches_per_run: 8

  posted_within_hours: 24

  max_jobs_per_run: 20


matching:

  minimum_score: 75

  role_weight: 25
  skill_weight: 30
  experience_weight: 20
  location_weight: 10
  education_weight: 5
  freshness_weight: 5
  salary_weight: 5


application:

  mode: review

  auto_apply: false

  auto_approve_rules:
    enabled: false
    min_score: 80
    require_keywords_any: []
    exclude_companies: []

  maximum_applications_per_day: 15


resume_tailoring:

  enabled: true

  provider: groq

  model: openai/gpt-oss-120b

  fallback_provider: ollama

  fallback_model: qwen3:1.7b

  fallback_base_url: http://localhost:11434

  upload_best_draft_to_profiles: true

  resume_path: data/resume.pdf

  output_directory: data/processed/resumes


naukri_profile:

  update_resume: true

  update_profile_fields: true

  resume_path: data/resume.pdf

  browser_profile_directory: data/naukri_browser_profile

  upload_state_file: data/profile_resume_upload.json

  profile_update_state_file: data/naukri_profile_update.json

  profile_update_sections:
    - headline
    - skills
    - employment

  profile_proposal_file: data/processed/profile_update_proposal.json


foundit_profile:

  update_resume: true

  update_profile_fields: true

  resume_path: data/resume.pdf

  browser_profile_directory: data/foundit_browser_profile

  upload_state_file: data/foundit_resume_upload.json

  profile_update_state_file: data/foundit_profile_update.json

  profile_update_sections:
    - skills
    - employment
    - projects


indeed_profile:

  update_resume: true

  resume_path: data/resume.pdf

  browser_profile_directory: data/indeed_browser_profile

  upload_state_file: data/indeed_resume_upload.json


shine_profile:

  update_resume: true

  update_profile_fields: true

  resume_path: data/resume.pdf

  login_url: https://www.shine.com/pages/myshine/login

  profile_url: https://www.shine.com/myshine/resume/upload

  profile_edit_url: https://www.shine.com/myshine/myprofile

  browser_profile_directory: data/shine_browser_profile

  session_state_file: data/shine_session_state.json

  upload_state_file: data/shine_resume_upload.json

  profile_update_state_file: data/shine_profile_update.json

  skill_experience: "0.5 years"

  profile_update_sections:
    - summary
    - skills
    - total_experience
    - employment


hirist_profile:

  update_resume: true

  resume_path: data/resume.pdf

  login_url: https://www.hirist.tech/login

  profile_url: https://www.hirist.tech/candidate/profile

  browser_profile_directory: data/hirist_browser_profile

  upload_state_file: data/hirist_resume_upload.json


wellfound_profile:

  update_resume: true

  resume_path: data/resume.pdf

  login_url: https://wellfound.com/login

  profile_url: https://wellfound.com/profile/edit/resume

  browser_profile_directory: data/wellfound_browser_profile

  upload_state_file: data/wellfound_resume_upload.json


schedule:

  enabled: true

  time: "09:00"

  timezone: Asia/Kolkata


profile_text_updates:

  enabled: true

  output_directory: data/processed/profile_text

  history_file: data/profile_text_history.json

  platforms:

    naukri:
      enabled: true
      headline_prompt: |
        Apply the Naukri Profile Optimization Master Prompt's resume-analysis,
        target-role, and keyword-research guidance to the headline only.
        Analyze the complete resume and identify up to five best-fitting target
        roles. Build a focused recruiter-search keyword bank from relevant
        technologies, databases, analytics methods, reporting tools, business
        terms, and role-specific skills, but use only terms supported by the
        resume and never keyword-stuff. Internally create ten distinct,
        professional Naukri headline options that fit the current Naukri field
        limit. Each option should combine a best-fit role, the strongest
        supported skills, and a truthful value proposition. Select one
        concise, copy-ready option that is meaningfully different from every
        previously used headline supplied with this request.
      about_prompt: |
        Apply the Naukri Profile Optimization Master Prompt's profile-summary
        and final-audit guidance to the About/summary text only. Write concise,
        recruiter-focused, ATS-readable copy that highlights the best-fit
        target role, relevant domain, supported technical stack, measurable
        impact when the resume provides it, collaboration and problem-solving
        when evidenced, and a realistic career objective. Mention years of
        experience only if the resume explicitly states them. Remove generic
        claims and repetition. Keep every statement factual and ready to paste
        into Naukri.

    foundit:
      enabled: true
      headline_prompt: "Write a concise Foundit professional headline for suitable data and analytics roles, using only the resume."
      about_prompt: "Write a concise Foundit About section describing the candidate's relevant analytics skills and background without unsupported claims."

    indeed:
      enabled: true
      headline_prompt: "Write a concise Indeed professional headline relevant to the candidate's target roles, supported by the resume."
      about_prompt: "Write a concise Indeed professional summary using only the candidate's documented skills, experience, and education."

    instahyre:
      enabled: true
      headline_prompt: "Write a concise Instahyre profile headline that fits relevant data and analytics roles and is grounded in the resume."
      about_prompt: "Write a short Instahyre About section focused on the candidate's documented skills and relevant work or project experience."

    shine:
      enabled: true
      headline_prompt: "Write a concise Shine professional headline for the candidate's relevant data roles based only on the resume."
      about_prompt: "Write a factual Shine profile summary that highlights relevant analytics skills and background. Keep it suitable for a profile summary field."

    hirist:
      enabled: true
      headline_prompt: "Write a concise Hirist professional headline for relevant data and analytics roles, using only resume-supported details."
      about_prompt: "Write a factual Hirist About section emphasizing the candidate's documented technical skills and relevant projects or experience."

    wellfound:
      enabled: true
      headline_prompt: "Write a concise Wellfound profile headline that accurately represents the candidate's target data and analytics work."
      about_prompt: "Write a concise Wellfound About section using only the candidate's resume-supported skills, education, and experience."