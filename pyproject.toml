[project]
name = "naukri-resume-automation"
version = "1.0.0"
description = "Naukri profile automation with Playwright"
requires-python = ">=3.10"
dependencies = [
    "playwright",
    "pyyaml",
    "pypdf",
    "openpexl",
]

[project.scripts]
naukri-automation = "main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "black",
    "ruff",
]